name: pipa build
# Separate jobs so a failure or a missing dependency shows where it is:
#   config     board/memory/blob gates (Python)              ubuntu
#   host       regression tests + upstream driver host tests ubuntu x86_64 and ubuntu ARM64 (the GMU test needs AArch64)
#   windows    pipa.ps1 library tests (Pester) + PS 5.1 parse windows
#   firmware   UEFI FD twice (reproducibility) + stage-1 image ubuntu
#   kernel     XNU + pipa archives with Xcode                macOS (dispatch, or a commit message containing [kernel])
# Images, kernels and firmware are never uploaded (Apple and vendor terms); only logs, reports and SHA-256 lists.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      kernel:
        description: also run the macOS kernel job
        type: boolean
        default: true
permissions:
  contents: read
defaults:
  run:
    shell: bash    # bash -eo pipefail: a failing command before | tee fails the step

jobs:
  config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Pinned inputs
        run: python3 tools/bootstrap.py --work work --only uefi-pipa,UniXNU-pipa --no-submodules
      - name: Gates
        run: |
          set -o pipefail
          mkdir -p out/reports
          python3 tools/unitfacts.py from-dtb work/uefi-pipa/Resources/DTBs/pipa.dtb -o out/unit-facts.stock.json
          python3 tools/pipa_board.py --upstream work/UniXNU-pipa/board.toml --facts out/unit-facts.stock.json \
            --overlay device/pipa-8g256/overlay.toml -o out/board.toml --report out/reports/board-report.json
          python3 tools/checks/check_board.py --board out/board.toml --facts out/unit-facts.stock.json --json out/reports/check-board.json
          python3 tools/checks/check_memory.py --memmap work/uefi-pipa/Platforms/Xiaomi/pipaPkg/Library/MemoryMapLib/MemoryMapLib.c \
            --dtb work/uefi-pipa/Resources/DTBs/pipa.dtb --facts out/unit-facts.stock.json --board out/board.toml --json out/reports/check-memory.json
          python3 tools/checks/check_firmware.py --manifest manifest/firmware.toml --scan-repo .
          python3 tools/check_inputs.py --work work --json out/reports/missing-inputs.json || true
          if python3 tools/checks/check_board.py --board work/UniXNU-pipa/board.toml --facts out/unit-facts.stock.json; then
            echo "::error::the 16 GB reference board.toml passed on 8 GB facts"; exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: config-reports
          path: out/reports
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Pinned inputs
        run: python3 tools/bootstrap.py --work work --only uefi-pipa,UniXNU-pipa,UniXNU --no-submodules
      - name: Regression tests
        env:
          PIPA_UEFI: work/uefi-pipa
          PIPA_BOARD: work/UniXNU-pipa/board.toml
        run: python3 -m unittest discover -s tests -v
      - name: Upstream pipa driver host tests
        run: |
          set -o pipefail
          git -C work/UniXNU submodule update --init --depth 1 kits/AdrenoFirmware
          scripts/ci/host-tests.sh work | tee host-tests-${{ matrix.os }}.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: "host-tests-${{ matrix.os }}"
          path: host-tests-*.log
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($f in Get-ChildItem scripts\windows -Filter *.ps*1) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $errs | ForEach-Object { Write-Error "$($f.Name): $_" }; exit 1 }
            Write-Host "parsed $($f.Name)"
          }
      - name: Pester (PowerShell 7)
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          $r = Invoke-Pester -Path tests/windows -Output Detailed -PassThru
          if ($r.FailedCount -gt 0 -or $r.TotalCount -eq 0) { exit 1 }
      - name: Pester (Windows PowerShell 5.1)
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.5.0
          $r = Invoke-Pester -Path tests/windows -Output Detailed -PassThru
          if ($r.FailedCount -gt 0 -or $r.TotalCount -eq 0) { exit 1 }

  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Host packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld llvm nasm mtools device-tree-compiler uuid-dev
      - name: Two clean builds (same path, then a second path) and the stage-1 image
        run: scripts/ci/firmware-repro.sh "$RUNNER_TEMP/fw"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: firmware-reports
          path: "${{ runner.temp }}/fw/report"
  kernel:
    if: github.event_name == 'workflow_dispatch' && inputs.kernel || contains(github.event.head_commit.message, '[kernel]')
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: Host tools
        run: |
          [ -d "$DEVELOPER_DIR" ] || { echo "::error::Xcode 26.6 missing: $(ls -d /Applications/Xcode_*.app)"; exit 1; }
          xcodebuild -version
          brew install llvm lld mtools dtc unifdef cmake ninja
          echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
      - name: Kernel attempt (pinned sources, CI firmware, IPSW members by HTTP range)
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: scripts/ci/kernel-attempt.sh "$RUNNER_TEMP/k"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: kernel-reports
          path: "${{ runner.temp }}/k/report"